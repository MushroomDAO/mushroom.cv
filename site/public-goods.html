<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字公共物品索引表 — Mycelium Protocol</title>
<meta name="description" content="Mycelium 生态中每一项数字公共物品的服务对象、能力、硬件与组织能力要求，以及 GitHub 仓库的快速索引。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'BlexMono Nerd Font';src:url('fonts/BlexMonoNerdFontMono-Regular.woff2') format('woff2');font-weight:400;font-display:swap;}
  @font-face{font-family:'BlexMono Nerd Font';src:url('fonts/BlexMonoNerdFontMono-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter','Microsoft YaHei','PingFang SC',sans-serif;color:#2c3e50;background:#f4f8f4;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:#e0724a;text-decoration:none;}
  a:hover{color:#c85a35;}
  .mp-mono{font-family:'BlexMono Nerd Font',monospace;}
  .pg-filter{cursor:pointer;font-family:inherit;font-weight:600;font-size:13px;padding:8px 16px;border-radius:9999px;border:1px solid rgba(0,0,0,.1);background:#fff;color:#5a6c7d;transition:background .2s,color .2s,border-color .2s;}
  .pg-filter[aria-pressed="true"]{border-color:#243b36;background:#243b36;color:#fff;}
  .pg-filter:hover{border-color:#243b36;}
  tbody tr{border-top:1px solid #eef1ee;vertical-align:top;}
  tbody tr:hover{background:#fafcfa;}
  .mp-noscript{margin:0;padding:14px clamp(16px,4vw,48px);background:#fff4e0;border-bottom:1px solid #f0d9a8;color:#7a5c1e;font-size:14px;text-align:center;}
</style>
</head>
<body>
<noscript>
  <p class="mp-noscript">索引表需要 JavaScript 才能显示。公共物品的权威信息以各
    <a href="https://github.com/AAStarCommunity" rel="noopener">GitHub 仓库</a>为准。</p>
</noscript>

<div style="min-height:100vh;">
  <!-- header -->
  <header style="position:sticky;top:0;z-index:20;background:rgba(244,248,244,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.06);padding:14px clamp(16px,4vw,48px);display:flex;justify-content:space-between;align-items:center;gap:16px;">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:#2c3e50;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      <img src="assets/mushroom-logo.png" alt="" width="26" height="26" style="width:26px;height:26px;object-fit:contain;">
      <span data-i18n="back" style="font-weight:700;font-size:15px;">返回花园</span>
    </a>
    <button type="button" id="lang-btn" style="cursor:pointer;border:1px solid rgba(0,0,0,.08);background:#fff;border-radius:9999px;padding:7px 15px;font-family:inherit;font-weight:600;font-size:13px;color:#2c3e50;display:flex;align-items:center;gap:7px;">
      <span style="width:7px;height:7px;border-radius:50%;background:#4ecdc4;display:inline-block;"></span><span id="lang-btn-label">EN</span>
    </button>
  </header>

  <div style="max-width:1180px;margin:0 auto;padding:clamp(30px,5vw,56px) clamp(16px,4vw,48px) 80px;">
    <!-- title -->
    <div class="mp-mono" data-i18n="kicker" style="margin-bottom:8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#2b8a8a;">完整索引</div>
    <h1 data-i18n="title" style="font-size:clamp(28px,4.5vw,44px);font-weight:800;letter-spacing:-1px;margin:0 0 12px;color:#243b36;">数字公共物品索引表</h1>
    <p data-i18n="intro" style="font-size:clamp(15px,1.8vw,18px);color:#5a6c7d;max-width:720px;margin:0 0 28px;">生态中每一项数字公共物品的服务对象、能力、硬件与组织能力要求，以及 GitHub 仓库的快速索引，帮助你快速找到适合自己的那一个。（数据为代表性示例，最终以各仓库为准。）</p>

    <!-- filters -->
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;" role="group">
      <button type="button" class="pg-filter" data-filter="all" aria-pressed="true" data-i18n="fAll">全部</button>
      <button type="button" class="pg-filter" data-filter="aastar" aria-pressed="false">AAStar</button>
      <button type="button" class="pg-filter" data-filter="auraai" aria-pressed="false">AuraAI</button>
      <button type="button" class="pg-filter" data-filter="mycelium" aria-pressed="false">Mycelium</button>
    </div>

    <!-- table -->
    <div style="background:#fff;border-radius:20px;box-shadow:0 12px 30px rgba(40,80,60,.09);overflow:hidden;">
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:14px;min-width:920px;">
          <thead>
            <tr style="background:#243b36;color:#fff;text-align:left;">
              <th data-i18n="colName" style="padding:15px 16px;font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;min-width:210px;">名称</th>
              <th data-i18n="colService" style="padding:15px 16px;font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;">服务对象</th>
              <th data-i18n="colCapability" style="padding:15px 16px;font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;min-width:230px;">能力</th>
              <th data-i18n="colHardware" style="padding:15px 16px;font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;">硬件要求</th>
              <th data-i18n="colOrg" style="padding:15px 16px;font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;">组织能力要求</th>
              <th data-i18n="colRepo" style="padding:15px 16px;font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;">仓库</th>
            </tr>
          </thead>
          <tbody id="pg-body"></tbody>
        </table>
      </div>
    </div>
    <p data-i18n="note" style="font-size:13px;color:#9aa8b2;margin-top:18px;">※ 表中部分链接与硬件为占位示例，最终以各仓库为准。</p>
  </div>
</div>

<script src="assets/goods-data.js"></script>
<script>
(function () {
  'use strict';

  // goods-data.js 是外部脚本；加载失败时给出提示而不是抛错留白
  var G = window.MYCELIUM_GOODS || null;
  var pick = (G && G.pick) || function (v, idx) { return Array.isArray(v) ? v[idx] : v; };

  var I18N = {
    back: ['返回花园', 'Back to garden'],
    kicker: ['完整索引', 'Full index'],
    title: ['数字公共物品索引表', 'Digital Public Goods Index'],
    intro: [
      '生态中每一项数字公共物品的服务对象、能力、硬件与组织能力要求，以及 GitHub 仓库的快速索引，帮助你快速找到适合自己的那一个。（数据为代表性示例，最终以各仓库为准。）',
      'A quick index of who each public good serves, what it does, its hardware and org requirements, and its GitHub repo — so you can find the right one fast. (Representative sample data; the repos are the source of truth.)'
    ],
    fAll: ['全部', 'All'],
    colName: ['名称', 'Name'],
    colService: ['服务对象', 'Serves'],
    colCapability: ['能力', 'Capability'],
    colHardware: ['硬件要求', 'Hardware'],
    colOrg: ['组织能力要求', 'Org requirements'],
    colRepo: ['仓库', 'Repo'],
    note: ['※ 表中部分链接与硬件为占位示例，最终以各仓库为准。', '※ Some links and hardware entries are placeholders — the repos are the source of truth.']
  };

  var LINK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';

  var lang = 'zh';
  var i = 0;
  var filter = 'all';

  var tbody = document.getElementById('pg-body');
  var langBtn = document.getElementById('lang-btn');
  var langLabel = document.getElementById('lang-btn-label');

  function td(css) {
    var el = document.createElement('td');
    el.style.cssText = 'padding:15px 16px;' + css;
    return el;
  }

  function renderRows() {
    if (!G) return;
    tbody.textContent = '';
    G.order.forEach(function (id) {
      var f = G.facilities[id];
      if (filter !== 'all' && f.owner !== filter) return;

      var tr = document.createElement('tr');

      // name + status + owner · metaphor
      var tdName = td('');
      var head = document.createElement('div');
      head.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;';
      var dot = document.createElement('span');
      dot.style.cssText = 'width:9px;height:9px;border-radius:50%;flex-shrink:0;background:' + f.dot + ';';
      head.appendChild(dot);
      var nm = document.createElement('span');
      nm.style.cssText = 'font-weight:700;color:#243b36;white-space:nowrap;';
      nm.textContent = pick(f.name, i);
      head.appendChild(nm);
      if (f.status) {
        var st = document.createElement('span');
        st.className = 'mp-mono';
        st.style.cssText = 'font-size:10px;color:#7a8a99;border:1px solid #e0e6ea;padding:1px 7px;border-radius:9999px;';
        st.textContent = pick(f.status, i);
        head.appendChild(st);
      }
      tdName.appendChild(head);
      var sub = document.createElement('div');
      sub.style.cssText = 'font-size:12px;color:#9aa8b2;margin-top:3px;padding-left:17px;';
      sub.textContent = pick(G.owners[f.owner], i) + ' · ' + pick(f.word, i);
      tdName.appendChild(sub);
      tr.appendChild(tdName);

      var tdService = td('color:#5a6c7d;white-space:nowrap;');
      tdService.textContent = pick(f.service, i);
      tr.appendChild(tdService);

      var tdCap = td('color:#4a5a64;');
      tdCap.textContent = pick(f.cap, i);
      tr.appendChild(tdCap);

      var tdHw = td('color:#5a6c7d;font-size:12px;');
      tdHw.className = 'mp-mono';
      tdHw.textContent = pick(f.hw, i);
      tr.appendChild(tdHw);

      var tdOrg = td('color:#5a6c7d;');
      tdOrg.textContent = pick(f.org, i);
      tr.appendChild(tdOrg);

      var tdRepo = td('');
      var a = document.createElement('a');
      a.href = f.repo;
      a.target = '_blank';
      a.rel = 'noopener';
      a.style.cssText = 'display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#243b36;';
      a.innerHTML = LINK_ICON;
      a.appendChild(document.createTextNode(pick(f.repoLabel, i)));
      tdRepo.appendChild(a);
      tr.appendChild(tdRepo);

      tbody.appendChild(tr);
    });
  }

  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      var key = el.getAttribute('data-i18n');
      if (I18N[key]) el.textContent = I18N[key][i];
    });
    langLabel.textContent = lang === 'zh' ? 'EN' : '中文';
    renderRows();
  }

  langBtn.addEventListener('click', function () {
    lang = lang === 'zh' ? 'en' : 'zh';
    i = lang === 'zh' ? 0 : 1;
    applyLang();
  });

  document.querySelectorAll('.pg-filter').forEach(function (btn) {
    btn.addEventListener('click', function () {
      filter = btn.getAttribute('data-filter');
      document.querySelectorAll('.pg-filter').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      renderRows();
    });
  });

  if (!G) {
    var warn = document.createElement('p');
    warn.className = 'mp-noscript';
    warn.textContent = '公共物品数据加载失败，索引表暂时无法显示。请刷新，或前往 github.com/AAStarCommunity 查看。';
    document.body.insertBefore(warn, document.body.firstChild);
  }

  applyLang();
})();
</script>
</body>
</html>
